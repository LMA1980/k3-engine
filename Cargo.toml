[package]
name = "k3-engine"
description = "Low-level compute runtime for the SpacemiT K3 AI platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository = "https://github.com/LMA1980/k3-engine"

[lints]
workspace = true

[dependencies]
arch-synthetic = { workspace = true, optional = true }
k3-core = { workspace = true }
kernels-rvv = { workspace = true, optional = true }
libc = { workspace = true }
rayon = { workspace = true }
serde = { workspace = true }

[dev-dependencies]
k3-tokenizer = { workspace = true }

[features]
default = ["arch-synthetic", "kernels-rvv"]
# In-process architecture recipe and compute kernel feature gates (ADR-024)
arch-synthetic = ["dep:arch-synthetic"]
kernels-rvv = ["dep:kernels-rvv", "arch-synthetic?/with-kernels"]
