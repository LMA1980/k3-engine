[package]
name = "k3-engine"
description = "Low-level compute runtime for the SpacemiT K3 AI platform"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "AGPL-3.0-only"
repository = "https://github.com/LMA1980/k3-engine"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"

[[bin]]
name = "k3-diag"
path = "src/bin/k3-diag/main.rs"

[[bin]]
name = "k3-worker"
path = "src/bin/k3-worker/main.rs"

[dependencies]
arch-synthetic = { version = "0.1.0", git = "https://github.com/LMA1980/k3-arch-synthetic.git", optional = true }
arrow-array = "59.3.1"
arrow-buffer = "59.3.1"
fory = "1.7.7"
fory-derive = "1.7.7"
k3-core = { version = "0.1.0", git = "https://github.com/LMA1980/k3-core.git" }
k3-tokenizer = { version = "0.1.0", git = "https://github.com/LMA1980/k3-tokenizer.git" }
kernels-rvv = { version = "0.1.0", git = "https://github.com/LMA1980/k3-kernels-rvv.git", optional = true }
libc = "0.2"
rayon = "1.12"
sendfd = "0.4.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.54.1", features = ["rt", "rt-multi-thread", "net", "io-util", "sync", "macros", "signal", "time"] }
zerocopy = { version = "0.8.63", features = ["derive"] }

[features]
default = ["arch-synthetic", "kernels-rvv"]
# In-process architecture recipe and compute kernel feature gates (ADR-024)
arch-synthetic = ["dep:arch-synthetic"]
kernels-rvv = ["dep:kernels-rvv", "arch-synthetic?/with-kernels"]
