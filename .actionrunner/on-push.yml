version: "2"
name: "k3-engine Factory Pipeline: Hygiene, Tests, Coverage & Benchmarks"

env:
  CARGO_TERM_COLOR: always

stages:
  - id: fmt-check
    name: "Verify Rust Formatting"
    tags: ["fmt"]
    threads: 2
    run: "cargo fmt --check"

  - id: clippy-check
    name: "Verify Rust Linter & Clippy Rules"
    tags: ["clippy"]
    depends_on: ["fmt-check"]
    threads: 4
    run: "cargo clippy --all-targets -- -D warnings"

  - id: audit-check
    name: "Verify Dependencies Security Advisories"
    tags: ["audit"]
    depends_on: ["fmt-check"]
    threads: 2
    run: "cargo generate-lockfile && cargo audit"

  - id: coverage-check
    name: "Evaluate Test Suite & Line Code Coverage (cargo llvm-cov)"
    tags: ["k3"]
    depends_on: ["clippy-check", "audit-check"]
    threads: 6
    run: "cargo llvm-cov --summary-only"
    timeout_seconds: 600

  - id: miri-check
    name: "Verify Safe Execution & Undefined Behavior via Miri (cargo +nightly miri test)"
    tags: ["k3"]
    depends_on: ["coverage-check"]
    threads: 6
    run: "cargo +nightly miri test -p k3-engine --lib || true"
    timeout_seconds: 600

  - id: bench-run
    name: "Execute Native Micro-Benchmarks (cargo bench)"
    tags: ["k3"]
    depends_on: ["coverage-check"]
    threads: 6
    run: "cargo bench --package k3-engine || true"
    timeout_seconds: 600
